version: '3.8' #versão do docker-compose

services: #serviços que vai gerenciar
  movieflix-postgres:
    image: postgres:15
    container_name: movieflix-postgres
    restart: always # always significa que o container vai reiniciar automaticamente caso ele pare por algum motivo
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: movieflix-db
    ports:
      - "5432:5432" #porta do container:porta do host
    volumes: #serve para persistir os dados do banco de dados mesmo que o container seja parado ou removido
      - ./data/postgres:/var/lib/postgresql/data

  movieflix-pgadmin: #serviço que vai gerenciar
    image: dpage/pgadmin4
    container_name: movieflix-pgadmin
    restart: always
    depends_on: # o movieflix-pgadmin depende do movieflix-postgres, ou seja, o pgadmin só vai iniciar depois que o postgres estiver rodando
      - movieflix-postgres
    environment: #configura usuario e senha
      - PGADMIN_DEFAULT_EMAIL=user@email.com
      - PGADMIN_DEFAULT_PASSWORD=password
    ports:
      - "5050:80"
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin